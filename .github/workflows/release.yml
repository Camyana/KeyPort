name: Release

# Tag a commit and push the tag to publish that version:
#   git tag -a v1.0.0 -m "1.0.0" && git push origin v1.0.0
#
# Required repository secret:
#   CF_API_KEY  - CurseForge API token (curseforge.com -> account -> API Tokens)
# Optional:
#   WOWI_API_TOKEN / WAGO_API_TOKEN if you also publish to WoWInterface / Wago.
#
# The packager reads ## X-Curse-Project-ID from KeyPort.toc to decide
# which CurseForge project to upload to, and .pkgmeta for the folder name and
# ignore list, so this file needs no per-release edits.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # A new repository hands GITHUB_TOKEN read-only permissions, and the
    # packager needs to create the GitHub release and attach the zip to it.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
